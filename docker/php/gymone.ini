; Las fotos de perfil admiten hasta 8 MB (register/index.php) y los logos
; del panel hasta 4 MB, asi que subimos los limites por defecto de PHP.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M

; mpdf genera facturas y necesita algo de holgura.
max_execution_time = 120

; Entorno de desarrollo: queremos ver los errores en pantalla.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

date.timezone = Europe/Madrid
