# Defensa en profundidad: el .htaccess de la raiz ya bloquea .env, pero si
# mod_access_compat no estuviese cargado esa directiva se ignora en silencio y
# el fichero quedaria servido en claro. Esto lo bloquea con sintaxis 2.4.
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>

# El repo trae un vendor/ completo y carpetas internas que no deben servirse.
<DirectoryMatch "/var/www/html/(vendor|docker)/">
    Require all denied
</DirectoryMatch>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
